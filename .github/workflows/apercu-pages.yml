name: Apercu de la charte en ligne

on:
  push:
    branches: [main]
    paths:
      - index.html
      - simulation.html
      - docs/simulation/**
      - scripts/packager-simulation.py
      - .github/workflows/apercu-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apercu-github-pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verifier et reconstruire la simulation
        run: |
          node docs/simulation/qa.cjs
          node docs/simulation/qa-preparation.cjs
          python3 scripts/packager-simulation.py
          git diff --exit-code -- index.html simulation.html docs/simulation/jetons.css
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Preparer la galerie et l'interface de simulation
        run: |
          mkdir -p _site
          cp index.html simulation.html _site/
          cp docs/simulation/exemple-import.json _site/exemple-import.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Publier l'apercu
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
